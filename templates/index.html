<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wanderer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🧭 Digital Wanderer</a>
    <button class="btn btn-outline-secondary" id="theme-toggle">🌙</button>
    <button class="btn btn-outline-primary d-md-none ms-2" data-bs-toggle="offcanvas" data-bs-target="#filterPanel">
      ⚙️ Filters
    </button>
  </div>
</nav>
<div class="container-fluid" style="padding-top: 70px;">
  <div class="row">
    <div class="col-md-3 d-none d-md-block">
      <div class="card p-3 mb-3">
        <h5>Filters</h5>
        <form id="filter-form" action="/search" method="post">
          <div class="mb-3">
            <label class="form-label"><strong>Category</strong></label>
            <select class="form-select" name="category">
              {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label"><strong>Keywords</strong></label>
            <input type="text" class="form-control" name="keywords" placeholder="e.g. vacation, 2023">
          </div>
          <div class="mb-3">
            <label class="form-label"><strong>Search Engines</strong></label><br>
            {% for name in SEARCH_ENGINES.keys() %}
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" name="engines" value="{{ name }}" checked>
              <label class="form-check-label">{{ name }}</label>
            </div>
            {% endfor %}
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="check_live" id="checkLive">
            <label class="form-check-label" for="checkLive">Check if links are live</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="discover" id="discover">
            <label class="form-check-label" for="discover">Discover open indexes</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="require_frontend" id="requireFrontend">
            <label class="form-check-label" for="requireFrontend">Require front-end</label>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-3">🔍 Search</button>
        </form>
      </div>
    </div>
    <div class="col-md-9">
      <div id="spinner" class="text-center my-5 d-none">
        <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <button class="btn btn-sm btn-outline-secondary" id="copy-all">📋 Copy All</button>
      </div>
      <ul id="history-list" class="list-group mb-3"></ul>
      <div id="results"></div>
    </div>
  </div>
</div>
<div class="offcanvas offcanvas-start" tabindex="-1" id="filterPanel">
  <div class="offcanvas-header">
    <h5>Filters</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <form id="filter-form-mobile" action="/search" method="post">
      <div class="mb-3">
        <label class="form-label"><strong>Category</strong></label>
        <select class="form-select" name="category">
          {% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label"><strong>Keywords</strong></label>
        <input type="text" class="form-control" name="keywords" placeholder="e.g. vacation, 2023">
      </div>
      <div class="mb-3">
        <label class="form-label"><strong>Search Engines</strong></label><br>
        {% for name in SEARCH_ENGINES.keys() %}
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="engines" value="{{ name }}" checked>
          <label class="form-check-label">{{ name }}</label>
        </div>{% endfor %}
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="check_live">
        <label class="form-check-label">Check if links are live</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="discover">
        <label class="form-check-label">Discover open indexes</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="require_frontend">
        <label class="form-check-label">Require front-end</label>
      </div>
      <button type="submit" class="btn btn-success w-100 mt-3">🔍 Search</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
